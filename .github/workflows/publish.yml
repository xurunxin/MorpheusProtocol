name: Publish tagged packages

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Configure Node registry client
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@xurunxin"

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(node -p "require('./packages/morpheus-protocol/package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
          test "$(node -p "require('./packages/morpheus-sdk/package.json').version")" = "${package_version}"

      - name: Install exact dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Run local-equivalent deterministic gates
        run: bun run verify
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Attest package tarballs
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ".artifacts/*.tgz"

      - name: Reconcile immutable candidates and next tags
        run: bun run publish:reconcile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
